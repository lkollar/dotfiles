<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #0f1726;
      --text: #e6edf3;
      --muted: #9fb0c3;
      --accent: #58a6ff;
      --warn: #ffb86b;
      --border: #263246;
      --bad: #ff7b72;
      --shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: linear-gradient(180deg, #0b1020 0%, #0e1424 100%); color: var(--text); line-height: 1.55; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 56px; }
    .hero, .section { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .hero { background: linear-gradient(180deg, rgba(88,166,255,.1), rgba(88,166,255,.03)); }
    h1, h2, h3 { margin: 0 0 12px; line-height: 1.2; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); font-size: 0.92rem; }
    .verdict { margin-top: 18px; display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,123,114,.35); background: rgba(255,123,114,.08); color: #ffd7d5; font-weight: 700; }
    .finding { padding: 18px; border: 1px solid var(--border); background: rgba(255,255,255,.02); border-radius: 14px; margin: 16px 0; }
    .priority { display: inline-block; margin-right: 8px; padding: 4px 8px; border-radius: 8px; font-size: .85rem; font-weight: 800; background: rgba(255,184,107,.15); color: var(--warn); border: 1px solid rgba(255,184,107,.3); }
    .loc { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.92rem; margin-bottom: 10px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #0a1120; border: 1px solid #22304a; border-radius: 6px; padding: 0.1rem 0.35rem; color: #d2e7ff; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.92rem; line-height: 1.5; color: #d7e6f7; }
    .snippet-group { display: grid; gap: 12px; margin-top: 14px; }
    .snippet { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0b1322; }
    .snippet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: #0f1a2d; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 0.9rem; }
    .snippet-body { padding: 12px; }
    .snippet mark { background: rgba(255, 184, 107, 0.18); color: #ffe5bd; padding: 0 0.12rem; border-radius: 4px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>{{TITLE}}</h1>
      <p>{{SUBTITLE}}</p>
      <div class="meta">
        {{META_CHIPS}}
      </div>
      <div class="verdict">Overall verdict: {{VERDICT}}</div>
    </section>

    <section class="section">
      <h2>Findings</h2>
      {{FINDINGS_HTML}}
    </section>

    <section class="section">
      <h2>Human Reviewer Callouts (Non-Blocking)</h2>
      {{CALLOUTS_HTML}}
    </section>
  </div>
</body>
</html>
