# Set the prefix to ctrl-a
set-option -g   prefix C-a
bind-key C-a    send-prefix

bind-key -n F1 copy-mode

unbind r
bind-key r source-file ~/.tmux.conf

set-option -g default-command "exec $SHELL -l"

set-option -g history-limit 100000
set-option -g status-interval 1
set-option -g monitor-silence 30

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# unbind ctrl-l to allow shell clear screen
unbind -n C-l

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

set-window-option -g mode-keys vi

bind | split-window -h
bind - split-window -v

# Hide and unhide panes
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.0

# allow Alt/Meta-based pane switching (for Cmd mapping in WezTerm)
set -g xterm-keys on
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set-option -g default-terminal "screen-256color"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

set -g status-right-length 100


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Pane border colors -- these have to come after plugins otherwise the theme
# will override them
set -g pane-border-style fg=colour238
set -g pane-active-border-style 'fg=colour214,bold'

# Split and zoom indicators in status bar
set -ag status-right "#[bg=colour237]#[fg=colour214] #(~/.local/bin/tmux-split-indicator.sh) #[default]#{?window_zoomed_flag,#[bg=red]#[fg=white] Z ,}"

# Change pane borders to red when zoomed
set-hook -g after-resize-pane 'if -F "#{window_zoomed_flag}" "set -g pane-border-style fg=red; set -g pane-active-border-style fg=red,bold" "set -g pane-border-style fg=colour238; set -g pane-active-border-style fg=colour214,bold"'
