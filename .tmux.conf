# Set the prefix to ctrl-a
set-option -g   prefix C-a
bind-key C-a    send-prefix

bind-key -n F1 copy-mode

unbind r
bind-key r source-file ~/.tmux.conf

set-option -g default-command "exec $SHELL -l"

set-option -g history-limit 100000
set-option -g status-interval 1
set-option -g monitor-silence 30

# act like vim
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# unbind ctrl-l to allow shell clear screen
unbind -n C-l

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

set-window-option -g mode-keys vi

bind | split-window -h
bind - split-window -v

# Hide and unhide panes
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.0

set-option -g default-terminal "screen-256color"

# Remote clipboard and other terminal integration tweaks
set -as terminal-overrides ",*:Tc"
# Allow OSC 52 clipboard passthrough
set -g allow-passthrough all
set -g set-clipboard on
# OSC52 clipboard integration (WezTerm over SSH)
set -as terminal-features ,wezterm:clipboard
set -as terminal-overrides ",wezterm:Ms=\E]52;%p1%s;%p2%s\007"
set -g @override_copy_command ~/.local/bin/osc52-copy

set -sa terminal-features ",*:hyperlinks"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

set -g status-right-length 100


# NixOS loads packaged plugins from /etc/tmux.conf. Other platforms use TPM.
if-shell 'test ! -e /etc/NIXOS' "run '~/.tmux/plugins/tpm/tpm'"

# Pane border colors -- these have to come after plugins otherwise the theme
# will override them
set -g pane-border-style fg=colour238
set -g pane-active-border-style 'fg=colour214,bold'

# Split and zoom indicators in status bar
set -ag status-right "#[bg=colour237]#[fg=colour214] #(~/.local/bin/tmux-split-indicator.sh) #[default]#{?window_zoomed_flag,#[bg=red]#[fg=white] Z ,}"

# Change pane borders to red when zoomed
set-hook -g after-resize-pane 'if -F "#{window_zoomed_flag}" "set -g pane-border-style fg=red; set -g pane-active-border-style fg=red,bold" "set -g pane-border-style fg=colour238; set -g pane-active-border-style fg=colour214,bold"'
